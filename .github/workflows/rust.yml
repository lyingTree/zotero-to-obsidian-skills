name: Rust CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_ocr:
        description: 'Bundle pinned PP-OCRv6 + ORT 1.32.0 runtime into platform release archives'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.95.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  resolve-lock:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify repository version alignment and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n literature-zotero2obsidian/scripts/ensure-runtime.sh
          repo_ver="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$repo_ver" ]]; then
            echo "Tag $GITHUB_REF_NAME must equal VERSION ($repo_ver)" >&2
            exit 1
          fi
          cargo_ver="$(awk -F'"' '/^version = / {print $2; exit}' rust/Cargo.toml)"
          if [[ "$repo_ver" != "v${cargo_ver}" ]]; then
            echo "VERSION ($repo_ver) must equal v${cargo_ver}" >&2
            exit 1
          fi
          for skill_md in literature-*/SKILL.md; do
            if ! tr -d '\r' < "$skill_md" | grep -q "^version: ${repo_ver}$"; then
              echo "$skill_md is missing version: ${repo_ver}" >&2
              exit 1
            fi
          done
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Verify the committed dependency graph
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" metadata --locked --format-version 1 --manifest-path rust/Cargo.toml > /dev/null
          git diff --exit-code HEAD -- rust/Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: resolved-rust-cargo-lock
          path: rust/Cargo.lock
          if-no-files-found: error

  rust:
    needs: resolve-lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check PowerShell installer syntax on Windows
        if: runner.os == 'Windows'
        working-directory: .
        shell: powershell
        run: |
          foreach ($scriptFile in @('install.ps1', 'literature-zotero2obsidian/scripts/ensure-runtime.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $scriptFile), [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: resolved-rust-cargo-lock
          path: rust
      - name: Install Rust development toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target ${{ matrix.target }}
      - name: Check the actual runner target
        run: rustc +1.95.0 -vV
      - name: Run Rust target tests
        run: cargo +1.95.0 test --locked --target ${{ matrix.target }}
      - name: Build release executable for the exact target
        run: cargo +1.95.0 build --locked --release --target ${{ matrix.target }}
      - name: Stage pinned PP-OCRv6 + ONNX Runtime bundle (releases and workflow_dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.bundle_ocr != false)
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          PY_BIN=""
          for cand in python3 python; do
            if command -v "$cand" >/dev/null 2>&1 && "$cand" -c "import sys; assert sys.version_info >= (3, 8)" >/dev/null 2>&1; then
              PY_BIN="$(command -v "$cand")"
              break
            fi
          done
          if [[ -z "$PY_BIN" ]]; then
            echo "Python 3.8+ required on CI runner to stage OCR bundle" >&2
            exit 1
          fi
          ocr_bundle="$RUNNER_TEMP/z2o-ocr-bundle-${TARGET_TRIPLE}"
          "$PY_BIN" -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/z2o-yaml" PyYAML==6.0.3
          export PYTHONPATH="$("$PY_BIN" -c 'import os; print(os.path.join(os.environ["RUNNER_TEMP"], "z2o-yaml"))')"
          rm -rf "$ocr_bundle"
          mkdir -p "$ocr_bundle"
          "$PY_BIN" - "$ocr_bundle" "$TARGET_TRIPLE" <<'PY'
          import hashlib, io, json, pathlib, re, sys, time, urllib.request, zipfile

          out_dir = pathlib.Path(sys.argv[1])
          target = sys.argv[2]
          cpu_assets = json.loads(pathlib.Path("ocr-cpu-assets.json").read_text(encoding="utf-8"))
          bundle_assets = json.loads(pathlib.Path("ocr-bundle-assets.json").read_text(encoding="utf-8"))
          tinfo = cpu_assets["targets"][target]

          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def read_url_with_retry(url: str, timeout: int) -> bytes:
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "z2o-release-builder/1.0"})
                      with urllib.request.urlopen(req, timeout=timeout) as resp:
                          return resp.read()
                  except Exception as exc:
                      if attempt == 3:
                          raise
                      print(f"Transient download error ({url}, attempt {attempt}): {exc}", file=sys.stderr, flush=True)
                      time.sleep(2 * attempt)
              raise RuntimeError(f"Unreachable retry state for {url}")

          def fetch_verified(url: str, expected_sha: str, expected_size=None) -> bytes:
              data = read_url_with_retry(url, timeout=180)
              actual_sha = sha256_bytes(data)
              if actual_sha != expected_sha:
                  raise RuntimeError(f"SHA-256 mismatch for {url}: expected {expected_sha}, got {actual_sha}")
              if expected_size is not None and len(data) != expected_size:
                  raise RuntimeError(f"Size mismatch for {url}: expected {expected_size}, got {len(data)}")
              return data

          def write_asset(filename: str, data: bytes) -> dict:
              dest = out_dir / filename
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              return {"path": filename, "sha256": sha256_bytes(data)}

          def extract_character_dict(yml_bytes: bytes) -> bytes:
              import yaml
              chars = yaml.load(yml_bytes, Loader=yaml.BaseLoader)["PostProcess"]["character_dict"]
              if not isinstance(chars, list) or not chars or not all(isinstance(c, str) for c in chars):
                  raise ValueError("Invalid PostProcess.character_dict")
              return ("\n".join(chars) + "\n").encode("utf-8")

          # 1. Download and verify pinned ONNX Runtime wheel for this target
          rt_ver = cpu_assets["version"]
          pypi_meta = json.loads(
              read_url_with_retry(f"https://pypi.org/pypi/onnxruntime/{rt_ver}/json", timeout=60).decode("utf-8")
          )
          wheel_url = next((u["url"] for u in pypi_meta["urls"] if u["filename"] == tinfo["wheel"]), None)
          if not wheel_url:
              raise RuntimeError(f"Wheel {tinfo['wheel']} not found on PyPI for onnxruntime {rt_ver}")
          wheel_bytes = fetch_verified(wheel_url, tinfo["sha256"])

          runtime_file_rec = None
          dep_recs = []
          with zipfile.ZipFile(io.BytesIO(wheel_bytes)) as zf:
              members_by_name = {}
              for info in zf.infolist():
                  if info.is_dir():
                      continue
                  base = pathlib.PurePosixPath(info.filename).name
                  members_by_name.setdefault(base, info.filename)
              for cand in tinfo["runtime_names"]:
                  if cand in members_by_name:
                      runtime_file_rec = write_asset(cand, zf.read(members_by_name[cand]))
                      break
              if runtime_file_rec is None:
                  raise RuntimeError(f"Missing runtime binary {tinfo['runtime_names']} in {tinfo['wheel']}")
              for dep in tinfo.get("dependencies", []):
                  if dep in members_by_name:
                      dep_recs.append(write_asset(dep, zf.read(members_by_name[dep])))

          # 2. Download and verify pinned PaddlePaddle ONNX models
          profiles_manifest = {}
          for prof_name in bundle_assets["default_bundled_profiles"]:
              prof = bundle_assets["profiles"][prof_name]
              det_bytes = fetch_verified(prof["detector"]["url"], prof["detector"]["sha256"], prof["detector"]["size"])
              rec_bytes = fetch_verified(prof["recognizer"]["url"], prof["recognizer"]["sha256"], prof["recognizer"]["size"])
              yml_bytes = fetch_verified(prof["dictionary_yaml"]["url"], prof["dictionary_yaml"]["sha256"], prof["dictionary_yaml"]["size"])
              dict_bytes = extract_character_dict(yml_bytes)
              import gzip
              reference = pathlib.Path("ocr-dictionaries") / (prof_name + ".txt.gz")
              if reference.exists() and dict_bytes != gzip.decompress(reference.read_bytes()):
                  raise RuntimeError(f"{prof_name} dictionary differs from pinned model vocabulary")

              profiles_manifest[prof_name] = {
                  "detector": write_asset(prof["detector"]["filename"], det_bytes),
                  "recognizer": write_asset(prof["recognizer"]["filename"], rec_bytes),
                  "dictionary": write_asset(prof["dictionary_yaml"]["extracted_dictionary"], dict_bytes),
              }

          aux = bundle_assets["auxiliary"]
          layout_bytes = fetch_verified(aux["layout"]["url"], aux["layout"]["sha256"], aux["layout"]["size"])
          ori_bytes = fetch_verified(aux["orientation"]["url"], aux["orientation"]["sha256"], aux["orientation"]["size"])
          tbl = aux["table_structure"]
          tbl_model_bytes = fetch_verified(tbl["model"]["url"], tbl["model"]["sha256"], tbl["model"]["size"])
          tbl_yml_bytes = fetch_verified(tbl["dictionary_yaml"]["url"], tbl["dictionary_yaml"]["sha256"], tbl["dictionary_yaml"]["size"])
          tbl_dict_bytes = extract_character_dict(tbl_yml_bytes)

          runtime_obj = {
              "platform": tinfo["platform"],
              "architecture": tinfo["architecture"],
              "version": rt_ver,
              "execution_provider": "CPUExecutionProvider",
              "file": runtime_file_rec,
          }
          if dep_recs:
              runtime_obj["dependencies"] = dep_recs

          pkg = {
              "schema_version": 1,
              "engine": "ppocr-v6",
              "runtime": runtime_obj,
              "profiles": profiles_manifest,
              "auxiliary": {
                  "layout": write_asset(aux["layout"]["filename"], layout_bytes),
                  "orientation": write_asset(aux["orientation"]["filename"], ori_bytes),
                  "table_structure": {
                      "architecture": tbl["architecture"],
                      "model": write_asset(tbl["model"]["filename"], tbl_model_bytes),
                      "dictionary": write_asset(tbl["dictionary_yaml"]["extracted_dictionary"], tbl_dict_bytes),
                  },
              },
          }
          pkg_bytes = (json.dumps(pkg, indent=2) + "\n").encode("utf-8")
          pkg_sha = sha256_bytes(pkg_bytes)
          (out_dir / "package.json").write_bytes(pkg_bytes)
          (out_dir / "package.sha256").write_text(pkg_sha + "\n", encoding="utf-8")
          print(f"Staged OCR bundle for {target}: sha256={pkg_sha}, profiles={list(profiles_manifest.keys())}")
          PY
      - name: Package skill bundle, verify installation, and stage release archives
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          exe="$(pwd)/target/${{ matrix.target }}/release/z2o${suffix}"
          bundle="$RUNNER_TEMP/z2o-rust-bundle-${{ matrix.target }}"
          ocr_bundle="$RUNNER_TEMP/z2o-ocr-bundle-${{ matrix.target }}"
          installed="$RUNNER_TEMP/z2o rust installed 中文"
          dist="$RUNNER_TEMP/release-dist-${{ matrix.target }}"
          rm -rf "$bundle" "$installed" "$dist"
          mkdir -p "$dist"

          "$exe" describe > "$RUNNER_TEMP/z2o-describe.json"
          if [[ -f "$ocr_bundle/package.json" ]]; then
            "$exe" package .. "$bundle" --ocr-bundle "$ocr_bundle"
          else
            "$exe" package .. "$bundle"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum < "$bundle/package.json" | awk '{print $1}' | tr -d '\r')"
          else
            digest="$(shasum -a 256 < "$bundle/package.json" | awk '{print $1}' | tr -d '\r')"
          fi
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          PATH="" "$exe" install "$bundle/package.json" "$digest" "$installed" > "$RUNNER_TEMP/z2o-install-receipt.json"
          if [[ -f "$ocr_bundle/package.json" ]]; then
            installed_exe="$installed/literature-zotero2obsidian/runtime/z2o${suffix}"
            "$installed_exe" describe | grep -q '"source":"exe_adjacent"'
          fi
          export Z2O_INSTALLED_SKILLS="$installed"
          export Z2O_INSTALL_MANIFEST="$bundle/package.json"
          export Z2O_INSTALL_RECEIPT="$RUNNER_TEMP/z2o-install-receipt.json"
          export Z2O_WORKFLOW_RECEIPT="$RUNNER_TEMP/z2o-installed-workflow-receipt.json"
          cargo +"$RUST_TOOLCHAIN" test --locked --target ${{ matrix.target }} \
            --test installed_workflow installed_mixed_source_workflow_without_path -- --ignored --exact

          cp "$exe" "$dist/z2o-${{ matrix.target }}${suffix}"
          (
            cd "$bundle"
            tar -czf "../z2o-skills-${{ matrix.target }}.tar.gz" package.json skills
          )
          mv "$RUNNER_TEMP/z2o-skills-${{ matrix.target }}.tar.gz" "$dist/z2o-skills-${{ matrix.target }}.tar.gz"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path '$bundle/package.json', '$bundle/skills' -DestinationPath '$dist/z2o-skills-${{ matrix.target }}.zip' -Force"
          else
            (cd "$bundle" && zip -qr "$dist/z2o-skills-${{ matrix.target }}.zip" package.json skills)
          fi
          if [[ -f "$ocr_bundle/package.json" ]]; then
            runtime="$bundle/skills/literature-zotero2obsidian/runtime"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              powershell.exe -NoProfile -Command "Compress-Archive -Path '$runtime/ocr' -DestinationPath '$dist/z2o-ocr-${{ matrix.target }}.zip' -Force"
            else
              tar -czf "$dist/z2o-ocr-${{ matrix.target }}.tar.gz" -C "$runtime" ocr
            fi
          fi
      - name: Upload platform release distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: release-dist-${{ matrix.target }}
          path: ${{ runner.temp }}/release-dist-${{ matrix.target }}/*
          if-no-files-found: error
      - name: Retain installation and workflow receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: rust-install-receipt-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/z2o-install-receipt.json
            ${{ runner.temp }}/z2o-installed-workflow-receipt.json
          if-no-files-found: error

  release:
    needs: [rust]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download all 5 platform release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          pattern: release-dist-*
          path: release-assets
          merge-multiple: true
      - name: Verify all 5 platform bundles and generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for target in \
            x86_64-pc-windows-msvc \
            aarch64-pc-windows-msvc \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            aarch64-apple-darwin; do
            [[ -f "z2o-skills-${target}.zip" ]]
            [[ -f "z2o-skills-${target}.tar.gz" ]]
            if [[ "$target" == *windows* ]]; then
              [[ -f "z2o-ocr-${target}.zip" ]]
            else
              [[ -f "z2o-ocr-${target}.tar.gz" ]]
            fi
          done
          chmod +x z2o-x86_64-unknown-linux-gnu z2o-aarch64-unknown-linux-gnu z2o-aarch64-apple-darwin
          sha256sum z2o-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish multi-platform assets to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "$tag" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$tag" \
              --generate-notes
          fi
