name: Build and test standalone runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-binary.txt
            literature-zotero2obsidian/requirements.txt
      - name: Install build-time dependencies
        run: python -m pip install -r requirements-binary.txt
      - name: Build standalone package
        run: python scripts/build_binary.py
      - name: Run frozen runtime without Python on PATH
        run: python scripts/smoke_binary.py
      # Public artifacts are redistribution. Upload only after owner reviews
      # PyMuPDF/MuPDF and all corresponding-source/license obligations.
      - name: Upload reviewed distribution
        if: github.event_name == 'workflow_dispatch' && vars.Z2O_BINARY_REDISTRIBUTION_APPROVED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: z2o-runtime-${{ matrix.os }}
          path: |
            dist/z2o-binary/*.zip
            dist/z2o-binary/*.tar.gz
            dist/z2o-binary/*.sha256
          if-no-files-found: error
