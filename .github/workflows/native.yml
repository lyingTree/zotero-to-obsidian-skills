name: Rust native migration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.95.0'

jobs:
  resolve-lock:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Verify the committed dependency graph
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" metadata --locked --format-version 1 --manifest-path native/Cargo.toml > /dev/null
          git diff --exit-code HEAD -- native/Cargo.lock
          echo Z2O_CARGO_LOCK_BEGIN
          cat native/Cargo.lock
          echo Z2O_CARGO_LOCK_END
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resolved-native-cargo-lock
          path: native/Cargo.lock
          if-no-files-found: error
  native:
    needs: resolve-lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: resolved-native-cargo-lock
          path: native
      - name: Install Rust development toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target ${{ matrix.target }}
      - name: Check the actual runner target
        run: rustc +1.95.0 -vV
      - name: Native target tests (including no-Python-PATH process tests)
        run: cargo +1.95.0 test --locked --target ${{ matrix.target }}
      - name: Build release executable for the exact target
        run: cargo +1.95.0 build --locked --release --target ${{ matrix.target }}
      # The migration is incomplete. No release artifact is published from this workflow.

  differential:
    needs: resolve-lock
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: resolved-native-cargo-lock
          path: native
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install reference-only dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build Rust reference-comparison target
        run: cargo +1.95.0 build --locked --manifest-path native/Cargo.toml
      - name: Record resolved dependency lockfile
        run: |
          echo Z2O_CARGO_LOCK_BEGIN
          cat native/Cargo.lock
          echo Z2O_CARGO_LOCK_END
      - name: Compare Python 1.1.0 and native operations
        run: python scripts/compare_native_reference.py
      - name: Check native release qualification policy
        run: |
          python -m unittest discover -s tests -p test_native_release_gate.py
          python scripts/check_native_release.py

  # Real weights and the official CPU runtime are test-only resources. The
  # regular six-platform jobs require neither an OCR model nor a GPU SDK.
  ocr-cpu-smoke:
    needs: resolve-lock
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      Z2O_OCR_FIXTURE_DIR: ${{ runner.temp }}/z2o-ocr-fixture
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned Rust development toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install fixture-only tools (not runtime requirements)
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Prepare provenance-checked official CPU runtime and Tiny models
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/prepare_ocr_ci_fixture.py
      - name: Real offline CPU inference from a bilingual image-only PDF
        run: cargo +1.95.0 test --locked --manifest-path native/Cargo.toml --test ocr actual_cpu_ocr_scan_with_verified_package -- --ignored --exact --nocapture
      - name: Retain actual resource provenance and inference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocr-cpu-smoke-evidence
          path: |
            ${{ runner.temp }}/z2o-ocr-fixture/package.json
            ${{ runner.temp }}/z2o-ocr-fixture/fixture.pdf
            ${{ runner.temp }}/z2o-ocr-fixture/fixture.png
            ${{ runner.temp }}/z2o-ocr-fixture/ocr-evidence/**
          if-no-files-found: warn
