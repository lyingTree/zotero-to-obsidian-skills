name: Rust native CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.95.0'

jobs:
  resolve-lock:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify pure native repository (no Python scripts or legacy directories)
        shell: bash
        run: |
          set -euo pipefail
          py_files="$(git ls-files '*.py' '*.pyc' '*.pyo' '*.pyw' '*.pyi' '*requirements*.txt' || true)"
          if [[ -n "$py_files" ]]; then
            echo "Legacy Python files must not exist in repository:" >&2
            echo "$py_files" >&2
            exit 1
          fi
          for d in literature-*/scripts scripts tests evals; do
            if [[ -e "$d" ]] && [[ -n "$(find "$d" -maxdepth 2 -name '*.py' 2>/dev/null || true)" ]]; then
              echo "Legacy Python directory still contains scripts: $d" >&2
              exit 1
            fi
          done
          bash -n install.sh
          repo_ver="$(tr -d '[:space:]' < VERSION)"
          cargo_ver="$(awk -F'"' '/^version = / {print $2; exit}' native/Cargo.toml)"
          if [[ "$repo_ver" != "v${cargo_ver}" && "$repo_ver" != "${cargo_ver}" ]]; then
            echo "VERSION ($repo_ver) does not match native/Cargo.toml ($cargo_ver)" >&2
            exit 1
          fi
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Verify the committed dependency graph
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" metadata --locked --format-version 1 --manifest-path native/Cargo.toml > /dev/null
          git diff --exit-code HEAD -- native/Cargo.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resolved-native-cargo-lock
          path: native/Cargo.lock
          if-no-files-found: error

  native:
    needs: resolve-lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check PowerShell installer syntax on Windows
        if: runner.os == 'Windows'
        working-directory: .
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: resolved-native-cargo-lock
          path: native
      - name: Install Rust development toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target ${{ matrix.target }}
      - name: Check the actual runner target
        run: rustc +1.95.0 -vV
      - name: Native target tests (including no-Python-PATH process tests)
        run: cargo +1.95.0 test --locked --target ${{ matrix.target }}
      - name: Build release executable for the exact target
        run: cargo +1.95.0 build --locked --release --target ${{ matrix.target }}
      - name: Package native skill bundle, verify zero-Python install, and stage release archives
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          exe="$(pwd)/target/${{ matrix.target }}/release/z2o${suffix}"
          bundle="$RUNNER_TEMP/z2o-native-bundle-${{ matrix.target }}"
          installed="$RUNNER_TEMP/z2o native installed 中文"
          dist="$RUNNER_TEMP/release-dist-${{ matrix.target }}"
          rm -rf "$bundle" "$installed" "$dist"
          mkdir -p "$dist"

          "$exe" describe > "$RUNNER_TEMP/z2o-describe.json"
          "$exe" package .. "$bundle"
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum < "$bundle/package.json" | awk '{print $1}' | tr -d '\r')"
          else
            digest="$(shasum -a 256 < "$bundle/package.json" | awk '{print $1}' | tr -d '\r')"
          fi
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          PATH="" "$exe" install "$bundle/package.json" "$digest" "$installed" > "$RUNNER_TEMP/z2o-install-receipt.json"
          export Z2O_INSTALLED_SKILLS="$installed"
          export Z2O_INSTALL_MANIFEST="$bundle/package.json"
          export Z2O_INSTALL_RECEIPT="$RUNNER_TEMP/z2o-install-receipt.json"
          export Z2O_WORKFLOW_RECEIPT="$RUNNER_TEMP/z2o-installed-workflow-receipt.json"
          cargo +"$RUST_TOOLCHAIN" test --locked --target ${{ matrix.target }} \
            --test installed_workflow installed_mixed_source_workflow_without_path -- --ignored --exact

          cp "$exe" "$dist/z2o-${{ matrix.target }}${suffix}"
          (
            cd "$bundle"
            tar -czf "../z2o-skills-${{ matrix.target }}.tar.gz" package.json skills
          )
          mv "$RUNNER_TEMP/z2o-skills-${{ matrix.target }}.tar.gz" "$dist/z2o-skills-${{ matrix.target }}.tar.gz"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path '$bundle/package.json', '$bundle/skills' -DestinationPath '$dist/z2o-skills-${{ matrix.target }}.zip' -Force"
          elif command -v zip >/dev/null 2>&1; then
            (cd "$bundle" && zip -qr "$dist/z2o-skills-${{ matrix.target }}.zip" package.json skills)
          else
            python3 -m zipfile -c "$dist/z2o-skills-${{ matrix.target }}.zip" "$bundle/package.json" "$bundle/skills"
          fi
      - name: Upload platform release distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-dist-${{ matrix.target }}
          path: ${{ runner.temp }}/release-dist-${{ matrix.target }}/*
          if-no-files-found: error
      - name: Retain native installation and workflow receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-install-receipt-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/z2o-install-receipt.json
            ${{ runner.temp }}/z2o-installed-workflow-receipt.json
          if-no-files-found: error

  release:
    needs: [native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Download all 5 platform release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-dist-*
          path: release-assets
          merge-multiple: true
      - name: Verify all 5 platform bundles and generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for target in \
            x86_64-pc-windows-msvc \
            aarch64-pc-windows-msvc \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            aarch64-apple-darwin; do
            [[ -f "z2o-skills-${target}.zip" ]]
            [[ -f "z2o-skills-${target}.tar.gz" ]]
          done
          chmod +x z2o-x86_64-unknown-linux-gnu z2o-aarch64-unknown-linux-gnu z2o-aarch64-apple-darwin
          sha256sum z2o-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish multi-platform assets to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "$tag" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$tag" \
              --generate-notes
          fi
