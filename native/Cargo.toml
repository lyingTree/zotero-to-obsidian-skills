[package]
name = "z2o-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Native deterministic Zotero-to-Obsidian runtime (migration candidate)"
publish = false

[[bin]]
name = "z2o"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
dunce = "1"
regex = "1"
fancy-regex = "=0.16.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "=2.2.0"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-casefold = "0.2"

tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
